[package]
name = "kubimo"
version = { workspace = true }
license = { workspace = true }
edition = "2024"

[features]
default = ["client", "runtime"]
client = [
  "kube/client",
  "kube/ring",
  "kube/rustls-tls",
  "kube/jsonpatch",
  "json-patch",
  "futures",
  "tracing",
]
runtime = ["kube/runtime"]
ws = ["kube/ws"]

[dependencies]
json-patch-macros = { path = "../json-patch-macros" }

futures = { version = "0.3", optional = true }
json-patch = { version = "4.0", default-features = false, optional = true }
k8s-openapi = { version = "0.27", features = ["latest", "schemars"] }
kube = { version = "3.0", default-features = false, features = ["derive"] }
schemars = { version = "1.0", features = ["derive", "chrono04", "url2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.27", features = ["derive"] }
thiserror = "2.0"
tracing = { version = "0.1", optional = true }
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2.5", features = ["serde"] }

[dev-dependencies]
cel-interpreter = "0.10.0"
tokio = { version = "1.47", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "signal",
  "time",
] }
clap = { version = "4.5", features = ["derive"] }
http = "1"
rustls = "0.23.36"
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = "0.3"
