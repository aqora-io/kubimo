name: ci

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      # The agent image is tagged by its own source; this asserts the hashed path list
      # still covers every crate the agent depends on. Missing one ships a stale agent
      # against a newer controller.
      - name: Agent image path list
        run: ./scripts/agent-image-rev --check
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
  helm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: "v4.2.3"
        id: install
      - name: Set up helm-unittest
        # https://github.com/helm-unittest/helm-unittest/blob/main/README.md#install
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --verify=false --version "v1.1.2"
      - name: Lint charts
        run: |
          for chart in charts/*/; do
            helm lint "$chart"
          done
      - name: Test charts
        run: |
          for chart in charts/*/; do
            helm unittest -u "$chart"
          done

  cache-py:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        # marimo pinned to the MARIMO_GIT tag in docker/Dockerfile.marimo;
        # bump this together with that pin.
        run: pip install 'marimo==0.23.6' pytest
      - name: Test cache.py
        run: pytest docker/app/test_cache.py -v
