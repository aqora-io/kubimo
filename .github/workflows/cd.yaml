name: cd

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: controller
            bake-target: controller
            registry: ghcr.io/aqora-io/kubimo-controller
          - name: marimo
            bake-target: marimo
            registry: ghcr.io/aqora-io/kubimo-marimo
          - name: agent
            bake-target: agent
            registry: ghcr.io/aqora-io/kubimo-agent
        platform:
          - runner: ubuntu-latest
            pair: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            pair: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image.registry }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Build and push by digest
        id: build
        uses: docker/bake-action@v7
        with:
          source: .
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file }}
          targets: ${{ matrix.image.bake-target }}
          set: |
            *.platform=${{ matrix.platform.pair }}
            *.output=${{ startsWith(github.ref, 'refs/tags/') && format('type=image,"name={0}",push-by-digest=true,name-canonical=true,push=true', matrix.image.registry) || 'type=cacheonly' }}
            *.cache-from=${{ startsWith(github.ref, 'refs/tags/') && format('type=registry,ref={0}:cache-{1}', matrix.image.registry, matrix.platform.arch) || format('type=gha,scope={0}-{1}', matrix.image.name, matrix.platform.arch) }}
            *.cache-to=${{ startsWith(github.ref, 'refs/tags/') && format('type=registry,ref={0}:cache-{1},mode=max', matrix.image.registry, matrix.platform.arch) || format('type=gha,scope={0}-{1},mode=max', matrix.image.name, matrix.platform.arch) }}
        env:
          SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_ENDPOINT }}
          SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
          SCCACHE_REGION: ${{ secrets.SCCACHE_REGION }}
          SCCACHE_AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
          SCCACHE_AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      - name: Export digest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p /tmp/digests
          digest="${{ fromJSON(steps.build.outputs.metadata)[matrix.image.bake-target]['containerimage.digest'] }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - name: controller
            registry: ghcr.io/aqora-io/kubimo-controller
          - name: marimo
            registry: ghcr.io/aqora-io/kubimo-marimo
          - name: agent
            registry: ghcr.io/aqora-io/kubimo-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Tags the agent and marimo images by their own sources, so a controller-only
      # release leaves both the DaemonSet pod template and the runners' image unchanged
      # and Kubernetes rolls neither. The marimo image needs this as much as the agent:
      # it is referenced by both the runners and the agent's venv-template initContainer,
      # so a version-derived tag rolls the agent even though the agent image itself is
      # pinned. Script names follow the image names.
      - name: Image source hash
        id: rev
        if: matrix.image.name == 'agent' || matrix.image.name == 'marimo'
        run: echo "rev=$(./scripts/${{ matrix.image.name }}-image-rev)" >> "$GITHUB_OUTPUT"
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image.name }}-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image.registry }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            ${{ steps.rev.outputs.rev && format('type=raw,value=src-{0}', steps.rev.outputs.rev) || '' }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ matrix.image.registry }}@sha256:%s ' *)
      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ matrix.image.registry }}:${{ steps.meta.outputs.version }}

  charts:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Print CRDs
        run: |
          cargo run --package kubimo --example print_crds -- --helm-if .Values.crds.enabled > charts/kubimo-controller/templates/crds.json
      # Pin the agent to its source hash rather than the chart appVersion, so a
      # controller-only release renders an unchanged DaemonSet pod template. Rolling the
      # agent destroys the node data volume and restarts every runner on that node.
      - name: Pin agent image to its source hash
        run: |
          set -eu
          values=charts/kubimo-controller/values.yaml
          # Fail loudly rather than silently pinning nothing if the key moves or is renamed.
          if [ "$(grep -c '^    sourceTag: ""$' "$values")" -ne 1 ]; then
            echo "error: expected exactly one empty agent.image.sourceTag in $values" >&2
            exit 1
          fi
          rev=$(./scripts/agent-image-rev)
          sed -i "s|^    sourceTag: \"\"$|    sourceTag: \"src-${rev}\"|" "$values"
          grep -n 'sourceTag:' "$values"
      # Same again for the marimo image, which the runners and the agent's venv-template
      # initContainer both resolve to. Left on the appVersion it would roll the agent on
      # every release regardless of the pin above, and recreate every runner pod besides.
      # The two keys are told apart by indentation: marimo.sourceTag sits at the top
      # level, agent.image.sourceTag one level deeper.
      - name: Pin marimo image to its source hash
        run: |
          set -eu
          values=charts/kubimo-controller/values.yaml
          if [ "$(grep -c '^  sourceTag: ""$' "$values")" -ne 1 ]; then
            echo "error: expected exactly one empty marimo.sourceTag in $values" >&2
            exit 1
          fi
          rev=$(./scripts/marimo-image-rev)
          sed -i "s|^  sourceTag: \"\"$|  sourceTag: \"src-${rev}\"|" "$values"
          grep -n 'sourceTag:' "$values"
      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
