# Default values for charts.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/aqora-io/kubimo-controller
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# The marimo image: what runners are started with, and what the agent stages its venv
# template from. Both resolve through one helper so they cannot drift apart — see
# `kubimo-controller.marimoImage` in templates/_helpers.tpl.
marimo:
  repository: ghcr.io/aqora-io/kubimo-marimo
  # Written by CI at release time to `src-<hash>`, hashed over the marimo image's own
  # inputs: the indexer's sources (the image ships it), the Dockerfile and the files
  # baked into it, and the pinned marimo fork. See scripts/marimo-image-rev.
  #
  # This exists so a controller-only release leaves this tag alone. Moving it recreates
  # every runner pod *and* rolls the agent DaemonSet, which destroys each node's data
  # volume and re-hydrates every slot on it. Generated — do not hand-edit.
  sourceTag: ""
  # Overrides sourceTag. Empty means follow sourceTag, then the chart appVersion.
  tag: ""

# controller:
#   rustLog: info
#   managerName: kubimo-controller
#   marimoImage: ghcr.io/aqora-io/kubimo-marimo:latest
#   busyboxImage: busybox:stable
#   ingressClassName: nginx
#   runnerHosts:
#     - kubimo.org
#   clusterIssuer: letsencrypt-prod
#   runnerProxyTimeoutSecs: 3600
#   runnerStatus:
#     resolution:
#       method: ServiceDns
#       # host: https://kubimo.org
#     intervalSecs: 10
#   # Storage mode for workspaces that do not set spec.mode: Dedicated (a PVC each) or
#   # Pooled (a slot on the shared per-node volume, which needs agent.enabled). Only
#   # affects newly created workspaces — every workspace pins its mode into status.mode
#   # on first reconcile, so flipping back changes what is created next and migrates
#   # nothing. Requires the node agent to be running before it is set to Pooled.
#   defaultWorkspaceMode: Dedicated

# Shared static-asset origin for marimo's frontend. Runners serve their UI
# under a per-runner (per-claim, for pooled runners) path prefix, so browsers
# re-download every JS/CSS file for each new session. Enabling this deploys a
# small nginx serving the marimo images' `_static` under `{basePath}/{image
# tag}` with long-lived immutable cache headers, and makes the controller
# point every runner's marimo at it (`--asset-url` via KUBIMO_ASSET_URL), so
# assets are fetched — and cached — from one stable, runner-independent URL.
#
# Off by default. Before enabling, route `basePath` to this chart's
# static-assets Service in everything that fronts the runners (the platform
# reverse proxy in production, traefik in local dev), or notebook UIs will
# 404 on their assets.
staticAssets:
  enabled: false
  # Plain path prefix (no regex metacharacters); also what the controller
  # receives as KUBIMO__RUNNER_ASSET_BASE_PATH.
  basePath: /marimo-assets
  image: nginx:1.27-alpine
  replicas: 1
  resources: {}

crds:
  enabled: true

# Requires the 'metrics' feature to be enable
# in the 'controller' crate.
metrics:
  enabled: true
  port: 9090
  service:
    enabled: true
    type: ClusterIP
    annotations: {}
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# Node agent: owns the per-node data volume and hands workspace slots to runner
# pods through a CSI node plugin.
agent:
  enabled: false
  image:
    repository: ghcr.io/aqora-io/kubimo-agent
    pullPolicy: IfNotPresent
    # Written by CI at release time to `src-<hash>`, hashed over the agent's own
    # sources — every workspace member except controller/, plus the build inputs.
    # See scripts/agent-image-rev.
    #
    # This exists so a controller-only release renders a byte-identical DaemonSet and
    # Kubernetes does not roll the agent: replacing an agent pod destroys the node's
    # data volume and restarts every runner on it. Generated — do not hand-edit.
    sourceTag: ""
    # Overrides sourceTag. Empty means follow sourceTag, then the chart appVersion.
    tag: ""
  registrarImage: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.14.0
  # Shutdown drain. Replacing an agent pod destroys the node data volume, and every
  # runner still holding a slot is left on a mount whose device has detached — reads
  # return EIO and the newest work never reaches S3. The drain deletes those pods first,
  # while the agent can still serve NodeUnpublishVolume, so each slot flushes and
  # unmounts cleanly and the runner is recreated against the replacement agent.
  #
  # Best-effort: a node crash or SIGKILL skips it. It fixes planned replacements, which
  # is every deploy.
  drain:
    enabled: true
    # The three are ordered: terminationGracePeriodSeconds > timeoutSeconds >
    # runnerGracePeriodSeconds. The chart refuses to render otherwise, because a drain
    # truncated mid-flush leaves some slots flushed and some not.
    timeoutSeconds: 120
    runnerGracePeriodSeconds: 10
    terminationGracePeriodSeconds: 150
  # Source of the staged venv template. Leave empty to follow
  # `controller.marimoImage`, which is what runners are started with — the two
  # must match, or slots reflink a venv built for a different interpreter than
  # the runner runs. Only set this to pin them apart deliberately.
  marimoImage: ""
  # Minimum kernel release required to serve slots. A shared node volume makes
  # kernel filesystem bugs cross-tenant; see CVE-2026-64600 (RefluXFS). The
  # patched release is distro-specific, so set it to your node pool's.
  minKernelVersion: ""
  allowUnpatchedKernel: false
  kubeletDir: /var/lib/kubelet
  rustLog: info
  # OPTIONAL fallback S3 credentials, mounted as envFrom.
  #
  # Normally leave this empty. A workspace's credentials reach the agent
  # per-mount: the controller puts the Secret named by `spec.indexer.pod.envFrom`
  # on the volume as `nodePublishSecretRef`, kubelet resolves it in the *runner
  # pod's* namespace and hands the contents to NodePublishVolume. That is what
  # lets one node serve workspaces from several S3 accounts at once — on a
  # shared cluster each environment has its own bucket *and* endpoint — and it
  # means the agent needs no access to Secrets of its own.
  #
  # This value is only for a cluster where every workspace lives in the same S3
  # account and nothing sets `spec.indexer.pod`: a dev cluster, or standalone
  # kubimo. Setting it where per-workspace credentials also exist is harmless
  # (they take precedence) but misleading.
  #
  # Expected keys are what object_store reads: AWS_ACCESS_KEY_ID,
  # AWS_SECRET_ACCESS_KEY, AWS_ENDPOINT, AWS_REGION, AWS_ALLOW_HTTP. The bucket
  # comes from each workspace's spec.indexer.bucket, never from here.
  s3SecretName: ""
  # Per-node data volume, provisioned as a generic ephemeral volume so each
  # DaemonSet pod gets its own PVC. Sized to the working set of the slots on a
  # node, not to the sum of their quotas: slot quotas are deliberately
  # overcommitted, and the agent evicts idle slots under pressure.
  dataVolume:
    storageClassName: kubimo-node-data
    size: 200Gi
    createStorageClass: true
    provisioner: csi.scaleway.com
  # DEVELOPMENT ONLY. Lets the agent serve slots on a filesystem without XFS
  # project-quota enforcement, which means slots have NO capacity limit and one
  # workspace can fill the volume for every other tenant on the node.
  allowUnquotaedSlots: false
  # How long an idle, flushed slot is kept before the reaper drops it. A slot is
  # a cache — its contents are already in S3 — so eviction costs one re-hydrate
  # on next use, and only slots this node has actually flushed are eligible.
  # 0 disables eviction, trading disk for never paying that re-hydrate.
  #
  # Spelled out here rather than left empty for the agent to default, because
  # `with`/`if` treat 0 as absent in Go templates: an operator setting 0 to turn
  # eviction off would have got the 24h default instead, silently.
  idleSlotTtlSeconds: 86400
  nodeSelector: {}
  tolerations: []
  priorityClassName: ""
