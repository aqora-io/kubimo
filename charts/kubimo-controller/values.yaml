# Default values for charts.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/aqora-io/kubimo-controller
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# controller:
#   rustLog: info
#   managerName: kubimo-controller
#   marimoImage: ghcr.io/aqora-io/kubimo-marimo:latest
#   busyboxImage: busybox:stable
#   ingressClassName: nginx
#   runnerHosts:
#     - kubimo.org
#   clusterIssuer: letsencrypt-prod
#   runnerStatus:
#     resolution:
#       method: ServiceDns
#       # host: https://kubimo.org
#     intervalSecs: 10

crds:
  enabled: true

# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# Node agent: owns the per-node data volume and hands workspace slots to runner
# pods through a CSI node plugin.
agent:
  enabled: false
  driverName: kubimo.aqora.io
  image:
    repository: ghcr.io/aqora-io/kubimo-agent
    pullPolicy: IfNotPresent
    tag: ""
  registrarImage: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.14.0
  # Source of the staged venv template. Must match the image runners use, or
  # they will get a venv built for a different interpreter.
  marimoImage: ghcr.io/aqora-io/kubimo-marimo:latest
  # Minimum kernel release required to serve slots. A shared node volume makes
  # kernel filesystem bugs cross-tenant; see CVE-2026-64600 (RefluXFS). The
  # patched release is distro-specific, so set it to your node pool's.
  minKernelVersion: ""
  allowUnpatchedKernel: false
  kubeletDir: /var/lib/kubelet
  rustLog: info
  # Secret holding S3 credentials for the workspace archive bucket, mounted as
  # envFrom. The agent is the only thing that reads or writes a pooled
  # workspace's archive, so without this it cannot hydrate a slot (the mount
  # fails and the runner never starts) nor flush one (logged and dropped).
  #
  # Expected keys are what object_store's AmazonS3Builder::from_env reads:
  # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_ENDPOINT, AWS_REGION,
  # AWS_ALLOW_HTTP. The bucket is not read from here — it comes from each
  # workspace's spec.indexer.bucket.
  #
  # Must exist in the release namespace. Empty leaves the agent without archive
  # access: slots still mount, but nothing is ever persisted to S3.
  s3SecretName: ""
  # Per-node data volume, provisioned as a generic ephemeral volume so each
  # DaemonSet pod gets its own PVC. Sized to the working set of the slots on a
  # node, not to the sum of their quotas: slot quotas are deliberately
  # overcommitted, and the agent evicts idle slots under pressure.
  dataVolume:
    storageClassName: kubimo-node-data
    size: 200Gi
    createStorageClass: true
    provisioner: csi.scaleway.com
  # DEVELOPMENT ONLY. Lets the agent serve slots on a filesystem without XFS
  # project-quota enforcement, which means slots have NO capacity limit and one
  # workspace can fill the volume for every other tenant on the node.
  allowUnquotaedSlots: false
  nodeSelector: {}
  tolerations: []
  priorityClassName: ""
