apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubimo-controller.fullname" . }}
  labels:
    {{- include "kubimo-controller.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "kubimo-controller.selectorLabels" . | nindent 6 }}
  # Two controllers must never reconcile at once: they disagree on retired pod
  # slot-volume attributes and warm-pool template hashes, and fighting over
  # them mid-rollout churns every runner and warm pod in the cluster (seen
  # live: ~290 warm pods and ~10 pod replacements in 35s). The default
  # RollingUpdate lets the old pod keep running for its whole
  # terminationGracePeriodSeconds — and an old controller that only reacts to
  # SIGINT ignores the SIGTERM that starts that countdown outright — so
  # Recreate is what actually guarantees the old pod is gone before the new
  # one starts.
  strategy:
    type: Recreate
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "kubimo-controller.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kubimo-controller.fullname" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            # Set unconditionally, unlike its neighbours. The binary's own default is
            # derived from its crate version (default_marimo_image in
            # controller/src/config.rs), so leaving this out when `controller.marimoImage`
            # is unset would put the version-derived tag back — the one this helper exists
            # to avoid — and let the runners' image drift from the template the agent
            # stages from `kubimo-controller.marimoImage`.
            - name: KUBIMO__MARIMO_IMAGE
              value: {{ include "kubimo-controller.marimoImage" . | quote }}
            # Unconditional for the same reason: an ImportJob's fetch containers
            # must run the agent image this chart actually deploys, not one derived
            # from the controller's crate version.
            - name: KUBIMO__AGENT_IMAGE
              value: {{ include "kubimo-controller.agentImage" . | quote }}
            {{- with .Values.controller }}
            {{- if .rustLog }}
            - name: RUST_LOG
              value: {{ .rustLog | quote }}
            {{- end }}
            {{- if .managerName }}
            - name: KUBIMO__MANAGER_NAME
              value: {{ .managerName | quote }}
            {{- end }}
            {{- if .busyboxImage }}
            - name: KUBIMO__BUSYBOX_IMAGE
              value: {{ .busyboxImage | quote }}
            {{- end }}
            {{- if .clusterIssuer }}
            - name: KUBIMO__CLUSTER_ISSUER
              value: {{ .clusterIssuer | quote }}
            {{- end }}
            {{- if .ingressClassName }}
            - name: KUBIMO__INGRESS_CLASS_NAME
              value: {{ .ingressClassName | quote }}
            {{- end }}
            {{- if .runnerHosts }}
            - name: KUBIMO__RUNNER_HOSTS
              value: {{ if kindIs "string" .runnerHosts }}{{ .runnerHosts | quote }}{{ else }}{{ join "," .runnerHosts | quote }}{{ end }}
            {{- end }}
            {{- if .runnerProxyTimeoutSecs }}
            - name: KUBIMO__RUNNER_PROXY_TIMEOUT_SECS
              value: {{ .runnerProxyTimeoutSecs | quote }}
            {{- end }}
            {{- with .runnerStatus }}
            {{- with .resolution }}
            {{- if .method }}
            - name: KUBIMO__RUNNER_STATUS__RESOLUTION__METHOD
              value: {{ .method | quote }}
            {{- end }}
            {{- if .host }}
            - name: KUBIMO__RUNNER_STATUS__RESOLUTION__HOST
              value: {{ .host | quote }}
            {{- end }}
            {{- end }}
            {{- if .intervalSecs }}
            - name: KUBIMO__RUNNER_STATUS__INTERVAL_SECS
              value: {{ .intervalSecs | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            - name: KUBIMO__METRICS__BIND_ADDR
              value: "0.0.0.0:{{ $.Values.metrics.port }}"
            - name: KUBIMO__METRICS__ENABLED
              value: {{ if $.Values.metrics.enabled }}"true"{{ else }}"false"{{ end }}
            {{- if $.Values.staticAssets.enabled }}
            # Points every runner's marimo at the shared static-asset origin
            # (templates/static-assets.yaml). Tied to `staticAssets.enabled` so
            # runners never reference a path nothing serves.
            - name: KUBIMO__RUNNER_ASSET_BASE_PATH
              value: {{ $.Values.staticAssets.basePath | default "/marimo-assets" | quote }}
            {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
