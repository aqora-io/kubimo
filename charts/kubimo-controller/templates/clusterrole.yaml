apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubimo-controller.fullname" . }}
rules:
  - apiGroups: ["kubimo.aqora.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["*"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["*"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["*"]
  # Secrets: the pool controller creates each warm pod's `<pod>-claim` Secret
  # and the claim path copies a runner's sidecar secrets into it; the status
  # poller also reads `spec.token.secretRef` tokens (which 403'd before this
  # rule existed).
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "pods/log", "services", "persistentvolumeclaims", "serviceaccounts", "secrets"]
    verbs: ["*"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["*"]
