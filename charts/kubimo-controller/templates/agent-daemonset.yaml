{{- if .Values.agent.enabled }}
{{- /*
  `-0` on the bound, deliberately: every managed distribution reports a version
  with a build suffix (`v1.28.5-gke.1091002`, `v1.28.8-eks-a737599`), which
  semver reads as a *pre-release*, and a constraint with no pre-release of its
  own never matches one. So the plain `< 1.29.0` form silently passed on
  exactly the clusters this guard exists for. The lowest possible pre-release
  makes the comparison fall back to major/minor/patch.
*/ -}}
{{- if semverCompare "< 1.29.0-0" .Capabilities.KubeVersion.Version }}
{{- fail "the kubimo agent requires Kubernetes >= 1.29 (native sidecar containers for the CSI registrar)" }}
{{- end }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "kubimo-controller.fullname" . }}-agent
  labels:
    {{- include "kubimo-controller.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      {{- include "kubimo-controller.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        {{- include "kubimo-controller.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: {{ include "kubimo-controller.fullname" . }}-agent
      # A DaemonSet rather than controller-managed pinned Pods: a bare pod
      # pinned by nodeAffinity can never be rescheduled onto a cordoned node,
      # and a DaemonSet gets tolerations, priorityClassName and correct
      # autoscaler handling for free.
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- if .Values.agent.drain.enabled }}
      {{- include "kubimo-controller.validateDrain" . }}
      # Must exceed agent.drain.timeoutSeconds: preStop runs inside this budget, and a
      # drain cut off part-way leaves some slots flushed and some not — worse than not
      # draining at all. The helper above enforces the relationship.
      terminationGracePeriodSeconds: {{ .Values.agent.drain.terminationGracePeriodSeconds }}
      {{- end }}
      initContainers:
        # Stage the marimo image's /home/me skeleton onto the node data volume once, so each
        # slot can take a reflink copy of it instead of the runner rebuilding
        # ~920MB from scratch. Uses the marimo image because that is where the
        # venv lives; the agent image has no Python.
        - name: venv-template
          # Defaults to the runners' image, because it must equal it: this
          # stages one venv per node that every slot reflinks, so a different
          # image here hands runners a venv built for another interpreter.
          # Resolved through the shared helper so the two cannot drift, and so
          # this initContainer stops tracking the chart appVersion — it was the
          # reason a controller-only release still rolled the agent despite
          # `agent.image.sourceTag`. `agent.marimoImage` overrides it, but only
          # deliberately.
          image: "{{ .Values.agent.marimoImage | default (include "kubimo-controller.marimoImage" .) }}"
          securityContext:
            # The marimo image runs as uid 1000, but the freshly provisioned
            # data volume is root-owned, so the copy needs root — the same
            # reason the dedicated path's init-dirs container runs as root.
            runAsUser: 0
            runAsGroup: 0
          command:
            - sh
            - -c
            - |
              set -eu
              dest=/data/home-template
              # Only stage once per node volume, and stage atomically so a
              # crashed init container never leaves a half-copied template that
              # slots would then reflink.
              if [ -d "$dest" ]; then
                echo "venv template already staged"
                exit 0
              fi
              rm -rf "$dest.partial"
              cp -a /home/me "$dest.partial"
              mv "$dest.partial" "$dest"
              echo "staged venv template"
          volumeMounts:
            - name: data
              mountPath: /data
        # A *native* sidecar (an initContainer with restartPolicy: Always), not a regular
        # container. The registrar removes its socket from plugins_registry on SIGTERM
        # and kubelet then deregisters the driver. Regular containers are terminated
        # concurrently, so mid-drain there could be no plugin left for kubelet to call
        # NodeUnpublishVolume on — the drain would delete the pods and lose every flush,
        # which is strictly worse than not draining. Native sidecars are terminated only
        # after all regular containers, so registration outlives the agent's preStop.
        # Requires Kubernetes >= 1.29.
        - name: node-driver-registrar
          image: "{{ .Values.agent.registrarImage }}"
          restartPolicy: Always
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path={{ .Values.agent.kubeletDir }}/plugins/kubimo.aqora.io/csi.sock
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
      containers:
        - name: agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag | default .Values.agent.image.sourceTag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          args:
            - --data-root=/data
            - serve
            - --socket=/csi/csi.sock
            # Where the stale-mount sweep looks for published slots. Must match the
            # hostPath above, since that is where kubelet publishes them.
            - --kubelet-pods-dir={{ .Values.agent.kubeletDir }}/pods
            {{- with .Values.agent.minKernelVersion }}
            - --min-kernel-version={{ . }}
            {{- end }}
            {{- if .Values.agent.allowUnpatchedKernel }}
            - --allow-unpatched-kernel
            {{- end }}
            # Always rendered, never guarded: 0 is a meaningful value here and
            # Go templates treat it as absent.
            - --idle-slot-ttl-secs={{ .Values.agent.idleSlotTtlSeconds }}
            {{- if .Values.agent.allowUnquotaedSlots }}
            # DEVELOPMENT ONLY. Slots get no capacity limit, so one workspace
            # can fill the node volume and break every other tenant on it.
            - --allow-unquotaed-slots
            {{- end }}
          env:
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: RUST_LOG
              value: {{ .Values.agent.rustLog | quote }}
          {{- if .Values.agent.s3SecretName }}
          # S3 credentials for hydrating and flushing workspace archives. The
          # agent reads these via AmazonS3Builder::from_env.
          envFrom:
            - secretRef:
                name: {{ .Values.agent.s3SecretName | quote }}
          {{- end }}
          {{- if .Values.agent.drain.enabled }}
          # Delete the pods holding this node's slots *before* the agent stops serving,
          # so kubelet's NodeUnpublishVolume — which flushes each slot to S3 and unmounts
          # it — can still reach us. Without this, replacing the agent leaves every
          # runner on a mount whose device has detached, with its newest work unflushed.
          lifecycle:
            preStop:
              exec:
                command:
                  - kubimo-agent
                  - --data-root=/data
                  - drain
                  - --timeout-secs={{ .Values.agent.drain.timeoutSeconds }}
                  - --runner-grace-secs={{ .Values.agent.drain.runnerGracePeriodSeconds }}
          {{- end }}
          securityContext:
            # Required for mount(2), the fsxattr ioctl and quotactl_fd. This
            # makes the agent tier-0 trusted: it can see every tenant's files.
            privileged: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: plugin-dir
              mountPath: /csi
            - name: pods-dir
              # Mounted at the *same* path it has on the host, deliberately.
              # `NodePublishVolume` hands us kubelet's `target_path`, which is a host
              # path under `kubeletDir`, and the agent operates on it directly — so the
              # two must agree. Mounting it anywhere else makes every publish fail on a
              # path that does not exist inside the container.
              mountPath: {{ .Values.agent.kubeletDir }}/pods
              # Bidirectional so bind mounts the agent creates propagate back
              # out to kubelet's namespace, where the runner pod sees them.
              mountPropagation: Bidirectional
      volumes:
        # The node data volume, as a *generic ephemeral volume*.
        #
        # A DaemonSet cannot mount a per-node PVC: `claimName` is a static
        # string and DaemonSets have no `volumeClaimTemplates`, so every node
        # would contend for one claim. A generic ephemeral volume creates one
        # PVC per pod (`<pod>-data`), which is exactly per-node.
        #
        # The alternative — the agent holding a block volume and mounting it
        # into the host namespace — was measured on Scaleway and rejected: the
        # volume detaches ~10s after the holding pod is deleted, leaving a mount
        # entry whose device is gone. The path then looks mounted while every
        # I/O returns EIO, and a replacement agent cannot mount over it. Letting
        # kubelet own the whole lifecycle avoids that class of failure entirely.
        #
        # The cost is that slots do not survive replacement of the agent pod and
        # are re-hydrated from S3. That is not an extra cost: an agent restart
        # already invalidates every runner's bind mount on this node.
        - name: data
          ephemeral:
            volumeClaimTemplate:
              metadata:
                labels:
                  {{- include "kubimo-controller.selectorLabels" . | nindent 18 }}
                  app.kubernetes.io/component: agent
              spec:
                accessModes: ["ReadWriteOnce"]
                storageClassName: {{ .Values.agent.dataVolume.storageClassName }}
                resources:
                  requests:
                    storage: {{ .Values.agent.dataVolume.size }}
        - name: plugin-dir
          hostPath:
            path: {{ .Values.agent.kubeletDir }}/plugins/kubimo.aqora.io
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: {{ .Values.agent.kubeletDir }}/plugins_registry
            type: Directory
        - name: pods-dir
          hostPath:
            path: {{ .Values.agent.kubeletDir }}/pods
            type: Directory
{{- end }}
