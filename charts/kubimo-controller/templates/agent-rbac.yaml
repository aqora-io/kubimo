{{- if .Values.agent.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubimo-controller.fullname" . }}-agent
  labels:
    {{- include "kubimo-controller.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
---
# NOTE: this is a deliberate privilege *concentration* relative to the dedicated
# path, where each workspace got its own ServiceAccount and a Role scoped with
# `resourceNames: [<workspace>]`. One agent serves every slot on its node, so it
# necessarily needs access to every workspace it might host.
#
# The compensating controls are: the agent runs in its own namespace (never
# alongside tenant workloads), it is the only thing holding S3 credentials, and
# per-slot scoped credentials (STS AssumeRole with an `s3:prefix` condition)
# should replace the node-wide key before this is enabled in production.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubimo-controller.fullname" . }}-agent
  labels:
    {{- include "kubimo-controller.labels" . | nindent 4 }}
rules:
  # The file browser is served from these, so a flush must refresh them.
  - apiGroups: ["kubimo.aqora.io"]
    resources: ["workspacedirectories"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Read the Workspace to resolve its archive; write only storage usage.
  - apiGroups: ["kubimo.aqora.io"]
    resources: ["workspaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kubimo.aqora.io"]
    resources: ["workspaces/status"]
    verbs: ["get", "patch", "update"]
  # Both recovery paths delete pods that are holding this node's slots:
  #
  #   - the shutdown drain, so kubelet calls NodeUnpublishVolume while this agent can
  #     still flush and unmount them;
  #   - the stale-mount sweep, which recreates runners stranded on a mount whose device
  #     has gone. That one runs unconditionally, so this rule must not be gated on
  #     `agent.drain.enabled` — doing so would leave the sweep 403ing behind a single
  #     warn line, with the failure looking exactly like "nothing to sweep".
  #
  # Cluster-scoped because runner pods live in tenant namespaces, and a spec.nodeName
  # field selector still requires a cluster-wide list. RBAC cannot express "only pods on
  # my node", so this is genuinely broader than either path needs. It is a small
  # increment on an already tier-0 component — the agent is privileged on the node and
  # can read every tenant's files — but `delete` on any pod cluster-wide is the sharpest
  # verb here, so it is worth restating why it cannot be narrowed.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubimo-controller.fullname" . }}-agent
  labels:
    {{- include "kubimo-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubimo-controller.fullname" . }}-agent
subjects:
  - kind: ServiceAccount
    name: {{ include "kubimo-controller.fullname" . }}-agent
    namespace: {{ .Release.Namespace }}
{{- end }}
