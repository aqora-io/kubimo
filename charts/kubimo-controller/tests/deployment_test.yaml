suite: deployment
templates:
  - deployment.yaml

tests:
  - it: should use the Recreate strategy so two controllers never run at once
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate

  - it: should expose the metrics port when enabled
    set:
      metrics:
        enabled: true
        port: 9090
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
            containerPort: 9090
            protocol: TCP

  - it: should set KUBIMO__METRICS__ENABLED to true when enabled
    set:
      metrics:
        enabled: true
        port: 9090
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KUBIMO__METRICS__ENABLED
            value: "true"

  - it: should set the bind addr to 0.0.0.0:<port> when enabled
    set:
      metrics:
        enabled: true
        port: 9090
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KUBIMO__METRICS__BIND_ADDR
            value: "0.0.0.0:9090"

  - it: should not have a ports section when metrics is disabled
    set:
      metrics:
        enabled: false
        port: 9090
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].ports

  - it: should still set env vars (enabled=false) with correct values
    set:
      metrics:
        enabled: false
        port: 9090
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KUBIMO__METRICS__ENABLED
            value: "false"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KUBIMO__METRICS__BIND_ADDR
            value: "0.0.0.0:9090"

  - it: should respect a custom metrics port
    set:
      metrics:
        enabled: true
        port: 9095
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
            containerPort: 9095
            protocol: TCP
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KUBIMO__METRICS__BIND_ADDR
            value: "0.0.0.0:9095"

  - it: should point the controller at the agent image the chart deploys
    set:
      agent:
        image:
          sourceTag: src-abc
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KUBIMO__AGENT_IMAGE
            value: "ghcr.io/aqora-io/kubimo-agent:src-abc"

  - it: should let agent.image.tag override the agent source tag
    set:
      agent:
        image:
          repository: example.com/agent
          sourceTag: src-abc
          tag: pinned
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KUBIMO__AGENT_IMAGE
            value: "example.com/agent:pinned"
