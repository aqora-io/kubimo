[package]
name = "kubimo-controller"
version = { workspace = true }
license = { workspace = true }
edition = "2024"

[dependencies]
kubimo = { path = "../api", features = ["ws"] }

async-trait = "0.1"
futures = "0.3"
tokio = { version = "1.47", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "signal",
] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
config = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
json-patch = { version = "4.0", default-features = false }
percent-encoding = "2.3"
rand = "0.9"
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = [
  "charset",
  "http2",
  "rustls",
  "json",
] }
url = "2.5"
chrono = "0.4.42"
rustls = "0.23.36"
metrics = { version = "0.24.6", optional = true }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = ["http-listener"], optional = true }

[features]
default = ["metrics"]
metrics = ["dep:metrics", "dep:metrics-exporter-prometheus"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# For the operator examples only; the controller binary takes no arguments.
clap = { version = "4.5", features = ["derive"] }
