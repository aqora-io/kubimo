# Creates a workspace restored from another workspace's S3 archive — the
# manifest + content the indexer wrote under the given bucket/keyPrefix (see
# examples/basic.yaml). The source workspace does not need to still exist.
# Only tracked files are restored (`.ignore`d and gitignored files, `.git` and
# files over the indexer's max file size are not part of the archive).
#
# The restored workspace's own indexer must point at a different keyPrefix
# than restoreFrom, otherwise it would overwrite the source archive.
#
# The seed is fetched with the workspace's own credentials — the `envFrom`
# secret below (from examples/basic.yaml), which the agent receives as the
# slot volume's nodePublishSecretRef — so the source archive must be readable
# by them.
apiVersion: kubimo.aqora.io/v1
kind: Workspace
metadata:
  name: "restored"
spec:
  storage:
    max: "10Gi"
  restoreFrom:
    bucket: "bucket"
    keyPrefix: "workspace/"
    # How to treat the source archive's secrets (the workspace `.env` and any
    # files matched by its `.secrets` patterns). "Values" restores them;
    # "NamesOnly" — the default when absent — writes `.env` with empty
    # placeholders instead and skips secret files, which is what a clone for
    # someone who may not see the source's secrets should use.
    secrets: "Values"
  indexer:
    bucket: "bucket"
    keyPrefix: "restored/"
    pod:
      envFrom:
        - secretRef:
            name: "workspace-s3"
---
apiVersion: kubimo.aqora.io/v1
kind: Runner
metadata:
  name: "restored-editor"
spec:
  command: "Edit"
  workspace: "restored"
  ingress:
    path: "/restored/edit"
