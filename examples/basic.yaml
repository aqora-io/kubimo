# S3 credentials for the workspace's archive. They must arrive as an
# `envFrom` secret reference: the agent receives that Secret as the slot
# volume's nodePublishSecretRef, while literal `pod.env` values never reach it.
apiVersion: v1
kind: Secret
metadata:
  name: "workspace-s3"
stringData:
  AWS_ENDPOINT: "http://minio-tenant-hl.minio-tenant.svc.cluster.local:9000"
  AWS_REGION: "us-east-1"
  AWS_ALLOW_HTTP: "true"
  AWS_ACCESS_KEY_ID: "minioadmin"
  AWS_SECRET_ACCESS_KEY: "minioadmin"
---
apiVersion: kubimo.aqora.io/v1
kind: Workspace
metadata:
  name: "workspace"
spec:
  storage:
    max: "10Gi"
  indexer:
    bucket: "bucket"
    keyPrefix: "workspace/"
    pod:
      envFrom:
        - secretRef:
            name: "workspace-s3"
---
apiVersion: kubimo.aqora.io/v1
kind: Runner
metadata:
  name: "editor"
spec:
  # logLevel: "Debug"
  command: "Edit"
  workspace: "workspace"
  # token:
  #   value: "token"
  # lifecycle:
  #   deleteAfterSecsInactive: 60
  ingress:
    path: "/workspace/edit"
    # tls:
    #   hosts:
    #     - "example.com"
    #   clusterIssuer: "letsencrypt-prod"
---
apiVersion: kubimo.aqora.io/v1
kind: Runner
metadata:
  name: "runner"
spec:
  # logLevel: "Debug"
  command: "Run"
  workspace: "workspace"
  # token:
  #   value: "token"
  # lifecycle:
  #   deleteAfterSecsInactive: 60
  ingress:
    path: "/workspace/run"
    # tls:
    #   hosts:
    #     - "example.com"
    #   clusterIssuer: "letsencrypt-prod"
