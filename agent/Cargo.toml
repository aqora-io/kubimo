[package]
name = "agent"
edition = "2024"
version.workspace = true
license.workspace = true

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
indexer = { path = "../indexer" }
# The `patch!` macros expand to `::json_patch` / `::serde_json` paths.
json-patch = { version = "4.0", default-features = false }
serde_json = "1.0"
# `runtime` is for the pod watch the claim watcher runs; the CSI paths only
# need `client`.
kubimo = { path = "../api", default-features = false, features = ["client", "runtime"] }
libc = "0.2"
prost = "0.14"
prost-types = "0.14"
rand = "0.9"
rustix = { version = "1", features = ["fs", "mount", "process", "system"] }
thiserror = "2.0"
tokio = { version = "1.47", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "net",
  "fs",
  "signal",
] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
tonic-prost = "0.14"
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[dev-dependencies]
tempfile = "3"
http = "1"
hyper-util = "0.1"
tower = { version = "0.5", features = ["util"] }
