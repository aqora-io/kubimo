[package]
name = "agent"
edition = "2024"
version.workspace = true
license.workspace = true

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
libc = "0.2"
rand = "0.9"
rustix = { version = "1", features = ["fs", "process"] }
thiserror = "2.0"
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
